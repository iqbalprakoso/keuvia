<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - KEUVIA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <!-- LOGO -->

        <div class="login-logo">
          <div class="logo-icon">
            <i class="fa-solid fa-wallet"></i>
          </div>

          <h1>KEUVIA</h1>

          <p>Catatan Keuangan Pribadi</p>
        </div>

        <!-- FORM LOGIN -->

        <form action="/login" method="POST" class="login-form">
          <div class="form-group">
            <label> Username </label>

            <div class="input-wrapper">
              <i class="fa-solid fa-user"></i>

              <input type="text" name="username" placeholder="Masukkan username" required autocomplete="username" />
            </div>
          </div>

          <div class="form-group">
            <label> Password </label>

            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>

              <input type="password" name="password" placeholder="Masukkan password" required autocomplete="current-password" />
            </div>
          </div>

          {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category, message in messages %}

          <div class="login-message {{ category }}">{{ message }}</div>

          {% endfor %} {% endif %} {% endwith %}

          <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i>

            Login
          </button>
          <div class="register-link">
            Belum punya akun?
            <a href="{{ url_for('register') }}"> Daftar sekarang </a>
          </div>
        </form>

        <div class="login-footer">
          <span> © 2026 KEUVIA </span>
        </div>
      </div>
    </div>
  </body>
</html>
